version: '3.8'

services:
  postgres-db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal-analytics-network
    # ports:
    #   - '5432:5432'

  fastapi-backend:
    build:
      context: server
      dockerfile: Dockerfile
    depends_on:
      - postgres-db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
    volumes:
      - ./server:/app/server:cached
    networks:
      - internal-analytics-network
    # ports:
    #   - '8000:8000'

  frontend:
    image: node:lts
    working_dir: /app
    depends_on:
      - fastapi-backend
    volumes:
      - ./:/app:cached
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '3000:3000'
    command: sh -c "npm install --silent && npm run dev"
    networks:
      - internal-analytics-network

volumes:
  db-data:

networks:
  internal-analytics-network:
    driver: bridge

apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend-service
  labels:
    app: dashboard-frontend
spec:
  ports:
    - name: "3000"
      port: 3000            # The port the service listens on
      targetPort: 3000      # The port on the pod to which the traffic is forwarded
  selector:
    app: dashboard-frontend
  type: LoadBalancer